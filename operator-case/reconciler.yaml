apiVersion: v1
kind: ServiceAccount
metadata:
  name: poc-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: poc-reconciler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: poc-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: poc-reconciler
subjects:
  - kind: ServiceAccount
    name: poc-reconciler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-reconciler
spec:
  replicas: 1
  selector:
    matchLabels: { app: poc-reconciler }
  template:
    metadata:
      labels: { app: poc-reconciler }
    spec:
      serviceAccountName: poc-reconciler
      containers:
        - name: reconciler
          image: alpine/k8s:1.34.12
          command: ["/bin/sh", "/script/reconcile.sh"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /script }
            - { name: desired, mountPath: /desired }
      volumes:
        - name: script
          configMap: { name: poc-reconciler-script }
        - name: desired
          configMap: { name: poc-reconciler-desired }
