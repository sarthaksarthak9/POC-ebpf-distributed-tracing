apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ebpf-poc

resources:
  - namespace.yaml
  - app.yaml

# Fixed name: operator-case/ mounts the same code.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ebpf-poc-app
    files:
      - app.js
      - entrypoint.sh
