# Stand-in for the Tier 2 collector and Tempo: receives OTLP on 4318, UI and API on 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: obi
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          ports:
            - containerPort: 4318
            - containerPort: 16686
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: obi
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318 }
    - { name: ui, port: 16686 }
